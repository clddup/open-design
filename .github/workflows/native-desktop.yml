name: Native desktop

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: native-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS package and smoke
            os: macos-14
            package-command: package:mac
            verify-command: verify:package:mac
            artifact-pattern: |
              apps/desktop/release/*.dmg
          - name: Windows package and smoke
            os: windows-2022
            package-command: package:win
            verify-command: verify:package:win
            artifact-pattern: |
              apps/desktop/release/*.exe
              apps/desktop/release/*.blockmap
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CI: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.32.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run shared verification
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: pnpm verify

      - name: Build native protected package
        run: pnpm --filter @opendesign/desktop ${{ matrix.package-command }}

      - name: Verify native package contents
        run: pnpm --filter @opendesign/desktop ${{ matrix.verify-command }}

      - name: Run packaged Agent smoke on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: OPENDESIGN_AGENT_SMOKE=1 apps/desktop/release/mac*/OpenDesign.app/Contents/MacOS/OpenDesign

      - name: Run packaged Agent smoke on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:OPENDESIGN_AGENT_SMOKE = "1"
          & "apps/desktop/release/win-unpacked/OpenDesign.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Remove previous native installer artifact
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ARTIFACT_NAME: OpenDesign-${{ runner.os }}-${{ runner.arch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_ids="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}" \
              --jq '.artifacts[].id'
          )"
          if [[ -n "$artifact_ids" ]]; then
            while IFS= read -r artifact_id; do
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            done <<< "$artifact_ids"
          fi

      - name: Upload native installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenDesign-${{ runner.os }}-${{ runner.arch }}
          path: ${{ matrix.artifact-pattern }}
          if-no-files-found: error
          retention-days: 1
